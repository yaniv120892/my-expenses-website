# Version updates only. Security updates are raised from Dependabot alerts as
# soon as an advisory is published, outside this schedule, the cooldown and the
# PR limits (repository setting: Dependabot security updates).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # The limits across both ecosystems add up to the routine PR cap (3).
    open-pull-requests-limit: 2
    cooldown:
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    cooldown:
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
