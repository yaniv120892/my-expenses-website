name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # The Sentry-wrapped build worker OOMs on Node's default ~2GB heap.
          NODE_OPTIONS: --max-old-space-size=4096

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JWT_SECRET: e2e-test-secret
      REDIS_URL: http://127.0.0.1:51230
      REDIS_TOKEN: e2e
      AI_PROVIDER: chatgpt
      OPENAI_API_KEY: e2e
      ASSISTANT_MODEL_URL: http://127.0.0.1:51231/v1
      CRON_SECRET: e2e
      # Test-only key; production uses its own secret.
      PRISMA_FIELD_ENCRYPTION_KEY: k1.aesgcm256.oAsfUHjnw25v7kaFzQXGAG24LEhRlt8Ow6cjjc5s3bE=
      # Imports: the extraction agent is the mock in test/e2e-api, and the S3
      # bucket exists only as the URL prefix the process endpoint validates —
      # the upload request itself is stubbed in the browser.
      WEBSITE_URL: http://127.0.0.1:3000
      EXCEL_EXTRACTION_AGENT_URL: http://127.0.0.1:51232
      EXCEL_EXTRACTION_AGENT_WEBHOOK_SECRET: e2e-extraction-secret
      IMPORTS_S3_BUCKET: e2e-imports
      IMPORTS_S3_REGION: us-east-1
      IMPORTS_S3_ACCESS_KEY_ID: e2e
      IMPORTS_S3_SECRET_ACCESS_KEY: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The app's Prisma client speaks the Accelerate protocol (prisma://),
      # so DATABASE_URL comes from prisma dev's local Prisma Postgres server;
      # DIRECT_URL is its plain TCP address (migrations, seed, Mastra memory).
      - name: Start local Prisma Postgres
        run: |
          npx prisma dev --detach --port 51213 --db-port 51214 --shadow-db-port 51215
          STATE="$HOME/.local/share/prisma-dev-nodejs/default/server.json"
          for i in $(seq 1 60); do
            node -e "require('$STATE').exports.ppg.url" 2>/dev/null && break
            sleep 1
          done
          echo "DATABASE_URL=$(node -e "console.log(require('$STATE').exports.ppg.url)")" >> "$GITHUB_ENV"
          echo "DIRECT_URL=$(node -e "console.log(require('$STATE').exports.database.connectionString)")" >> "$GITHUB_ENV"

      - run: npx prisma migrate deploy

      - name: Start app
        run: |
          npm run dev > next-dev.log 2>&1 &
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health || true)
            [ "$code" != "000" ] && [ -n "$code" ] && break
            sleep 1
          done
          [ "$code" != "000" ] || { echo 'app never answered /api/health'; tail -n 50 next-dev.log; exit 1; }

      - name: API e2e harness
        run: npm run test:e2e:api

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: UI e2e specs
        run: |
          npx tsx test/e2e-api/serve.ts > serve.log 2>&1 &
          for i in $(seq 1 60); do grep -q '^ready$' serve.log && break; sleep 1; done
          export E2E_AUTH_TOKEN="$(sed -n 's/^E2E_AUTH_TOKEN=//p' serve.log)"
          # An empty token silently skips every authenticated spec and the
          # job reports green; fail instead.
          [ -n "$E2E_AUTH_TOKEN" ] || { echo 'E2E_AUTH_TOKEN missing — serve.ts did not come up'; tail -n 50 serve.log; exit 1; }
          E2E_NO_WEBSERVER=1 npm run test:e2e:ui

      - name: Surface server logs on failure
        if: failure()
        run: tail -n 100 next-dev.log serve.log 2>/dev/null || true

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            next-dev.log
            serve.log
          if-no-files-found: warn
          retention-days: 7
