name: CI

# Pull requests only: main moves by squash-merging a PR whose run already
# passed on the same tree, so a push run would repeat it for Actions minutes.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: yaniv120892/dev-config/.github/workflows/node-ci.yml@v0.1.6
    with:
      audit: true
      node-version: '24'
      # The Sentry-wrapped build worker OOMs on Node's default ~2GB heap.
      build-node-options: --max-old-space-size=4096

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    # A real Postgres rather than prisma dev: that server runs every client on
    # one backend session, where the app's and Mastra's unnamed statements
    # interleave. Here each connection has its own session, as on Neon.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
      JWT_SECRET: e2e-test-secret
      REDIS_URL: http://127.0.0.1:51230
      REDIS_TOKEN: e2e
      AI_PROVIDER: chatgpt
      OPENAI_API_KEY: e2e
      ASSISTANT_MODEL_URL: http://127.0.0.1:51231/v1
      CRON_SECRET: e2e
      # Test-only key; production uses its own secret.
      PRISMA_FIELD_ENCRYPTION_KEY: k1.aesgcm256.oAsfUHjnw25v7kaFzQXGAG24LEhRlt8Ow6cjjc5s3bE=
      # Imports: the extraction agent is the mock in test/e2e-api, and the S3
      # bucket exists only as the URL prefix the process endpoint validates —
      # the upload request itself is stubbed in the browser.
      WEBSITE_URL: http://127.0.0.1:3000
      EXCEL_EXTRACTION_AGENT_URL: http://127.0.0.1:51232
      EXCEL_EXTRACTION_AGENT_WEBHOOK_SECRET: e2e-extraction-secret
      IMPORTS_S3_BUCKET: e2e-imports
      IMPORTS_S3_REGION: us-east-1
      IMPORTS_S3_ACCESS_KEY_ID: e2e
      IMPORTS_S3_SECRET_ACCESS_KEY: e2e
    steps:
      # Each later step is gated on `scope` rather than the job on a separate
      # deciding job, which would bill its own runner minute on every run.
      # Same Dependabot identity gate as dependabot-auto-merge.yml's `decide`.
      - id: metadata
        if: >-
          github.event.pull_request.user.login == 'dependabot[bot]' &&
          github.actor == 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        # Dependabot patch/minor bumps keep the `checks` job (audit, lint,
        # typecheck, unit tests, build); majors still run e2e. A diff that
        # cannot be listed runs e2e rather than skipping it.
        run: |
          case "$UPDATE_TYPE" in
            version-update:semver-patch | version-update:semver-minor)
              echo "Dependabot $UPDATE_TYPE: e2e skipped"
              echo run=false >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          files="$(gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --name-only || true)"
          if [ -n "$files" ] && ! grep -qvE '(^docs/|\.md$)' <<< "$files"; then
            echo 'Docs-only change: e2e skipped'
            echo run=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo run=true >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.scope.outputs.run == 'true'
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.scope.outputs.run == 'true'

      - run: npx prisma migrate deploy
        if: steps.scope.outputs.run == 'true'

      - name: Start app
        if: steps.scope.outputs.run == 'true'
        run: |
          npm run dev > next-dev.log 2>&1 &
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health || true)
            [ "$code" != "000" ] && [ -n "$code" ] && break
            sleep 1
          done
          { [ -n "$code" ] && [ "$code" != "000" ]; } || { echo 'app never answered /api/health'; tail -n 50 next-dev.log; exit 1; }

      - name: API e2e harness
        if: steps.scope.outputs.run == 'true'
        run: npm run test:e2e:api

      - name: Cache Playwright Chromium
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.scope.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: UI e2e specs
        if: steps.scope.outputs.run == 'true'
        run: |
          npx tsx test/e2e-api/serve.ts > serve.log 2>&1 &
          for i in $(seq 1 60); do grep -q '^ready$' serve.log && break; sleep 1; done
          export E2E_AUTH_TOKEN="$(sed -n 's/^E2E_AUTH_TOKEN=//p' serve.log)"
          # An empty token silently skips every authenticated spec and the
          # job reports green; fail instead.
          [ -n "$E2E_AUTH_TOKEN" ] || { echo 'E2E_AUTH_TOKEN missing — serve.ts did not come up'; tail -n 50 serve.log; exit 1; }
          E2E_NO_WEBSERVER=1 npm run test:e2e:ui

      - name: Surface server logs on failure
        if: ${{ failure() && steps.scope.outputs.run == 'true' }}
        run: tail -n 100 next-dev.log serve.log 2>/dev/null || true

      # Not failure()-gated: a flake that passes on retry leaves its trace in
      # the report, and that trace is the whole point of retries.
      - name: Upload Playwright artifacts
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            next-dev.log
            serve.log
          if-no-files-found: warn
          retention-days: 7
